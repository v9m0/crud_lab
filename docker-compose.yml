services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fileapp
      POSTGRES_PASSWORD: fileapp
      POSTGRES_DB: filesharing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileapp -d filesharing"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://fileapp:fileapp@db:5432/filesharing
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: "http://localhost:8000,http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
