<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог файлов</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B0C0F'/><path d='M10 7h7l6 6v12a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z' fill='none' stroke='%233DDC97' stroke-width='2' stroke-linejoin='round'/></svg>">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <div class="upload-section">
            <h2>Быстрая загрузка</h2>

            <div class="drop-zone" id="dropZone" role="button" tabindex="0"
                 aria-label="Перетащите файлы сюда или нажмите для выбора">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">
                        <img src="/static/icons/upload.svg" class="icon-svg" alt="">
                    </div>
                    <div class="drop-zone-text">Перетащите файлы сюда</div>
                    <div class="drop-zone-hint">или нажмите для выбора</div>
                </div>
            </div>

            <input type="file" id="fileInput" class="file-input" multiple>

            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
        </div>

        <div class="content-section">
            <div class="content-header">
                <div class="header-actions">
                    <input type="search" class="form-input toolbar-search" id="searchInput"
                           aria-label="Поиск по имени и описанию">
                    <select class="form-input toolbar-filter" id="publicFilter" aria-label="Фильтр по публичности">
                        <option value="">Все</option>
                        <option value="true">Только публичные</option>
                        <option value="false">Только приватные</option>
                    </select>
                    <button class="icon-btn" id="refreshBtn" title="Обновить список">
                        <img src="/static/icons/reload.svg" class="icon-svg" alt="Обновить">
                    </button>
                    <button class="icon-btn icon-btn-accent" id="createBtn" title="Добавить запись">
                        <img src="/static/icons/folder-plus.svg" class="icon-svg" alt="Добавить">
                    </button>
                </div>
            </div>

            <div class="notice" id="filesMessage"></div>

            <div class="loading" id="loadingFiles">
                <div class="spinner"></div>
                <p>Загрузка списка...</p>
            </div>

            <div id="filesContent" style="display: none;">
                <table class="files-table">
                    <thead>
                        <tr>
                            <th>Имя файла</th>
                            <th>Размер</th>
                            <th>Доступ</th>
                            <th>Создано</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="filesList"></tbody>
                </table>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <p>Записей пока нет. Нажмите «Добавить запись», чтобы создать первую.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить запись</h3>
                <button class="close-btn" id="closeFormModal">&times;</button>
            </div>
            <div class="modal-form">
                <div class="form-group">
                    <label class="form-label" for="fieldFilename">Имя файла</label>
                    <input type="text" class="form-input" id="fieldFilename" maxlength="255"
                           placeholder="например, отчёт.pdf">
                </div>
                <div class="form-group">
                    <label class="form-label">Файл</label>

                    <div class="drop-zone drop-zone-compact" id="formDropZone"
                         role="button" tabindex="0"
                         aria-label="Перетащите файл сюда или нажмите для выбора">
                        <div class="drop-zone-text">Перетащите файл сюда</div>
                        <div class="drop-zone-hint">или нажмите для выбора</div>
                    </div>

                    <div class="picked-file" id="pickedFile" style="display: none;">
                        <span class="picked-file-name" id="pickedFileName"></span>
                        <button type="button" class="picked-file-clear" id="clearPickedFile"
                                title="Убрать файл" aria-label="Убрать файл">&times;</button>
                    </div>

                    <input type="file" id="formFileInput" class="file-input">
                </div>

                <div class="form-group">
                    <label class="form-label" for="fieldDescription">Описание</label>
                    <textarea class="form-input" id="fieldDescription" rows="3" maxlength="5000"
                              placeholder="Необязательное описание"></textarea>
                </div>
                <div class="form-group form-group-inline">
                    <input type="checkbox" id="fieldIsPublic">
                    <label class="form-label" for="fieldIsPublic">Публичная запись</label>
                </div>
                <div class="error-message" id="formError"></div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="cancelForm">Отмена</button>
                <button class="modal-btn modal-btn-primary" id="submitForm">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
