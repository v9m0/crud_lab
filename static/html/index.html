<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог файлов</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Каталог файлов</h1>
            <p>Записи о файлах: создание, просмотр, изменение и удаление</p>
        </div>

        <div class="content-section">
            <div class="content-header">
                <div class="directory-title">
                    <h2 class="directory-name">Записи</h2>
                </div>
                <div class="header-actions">
                    <input type="search" class="form-input toolbar-search" id="searchInput"
                           placeholder="Поиск по имени и описанию">
                    <select class="form-input toolbar-filter" id="publicFilter" aria-label="Фильтр по публичности">
                        <option value="">Все</option>
                        <option value="true">Только публичные</option>
                        <option value="false">Только приватные</option>
                    </select>
                    <button class="refresh-btn" id="refreshBtn" title="Обновить список">
                        <img src="/static/icons/reload.svg" class="icon-svg" alt="Обновить">
                    </button>
                    <button class="create-folder-btn" id="createBtn" title="Добавить запись">
                        <img src="/static/icons/folder-plus.svg" class="icon-svg" alt="Добавить">
                    </button>
                </div>
            </div>

            <div class="files-message" id="filesMessage"></div>

            <div class="loading" id="loadingFiles">
                <div class="spinner"></div>
                <p>Загрузка списка...</p>
            </div>

            <div id="filesContent" style="display: none;">
                <table class="files-table">
                    <thead>
                        <tr>
                            <th>Имя файла</th>
                            <th>Описание</th>
                            <th>Размер</th>
                            <th>Доступ</th>
                            <th>Создано</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="filesList"></tbody>
                </table>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <p>Записей пока нет. Нажмите «Добавить запись», чтобы создать первую.</p>
                </div>

                <div class="table-footer" id="tableFooter"></div>
            </div>
        </div>
    </div>

    <!-- Скрытый input для загрузки содержимого к конкретной записи -->
    <input type="file" id="contentInput" class="file-input" hidden>

    <div class="modal" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="formModalTitle">Добавить запись</h3>
                <button class="close-btn" id="closeFormModal">&times;</button>
            </div>
            <div class="modal-form">
                <div class="form-group">
                    <label class="form-label" for="fieldFilename">Имя файла</label>
                    <input type="text" class="form-input" id="fieldFilename" maxlength="255"
                           placeholder="например, отчёт.pdf">
                </div>
                <div class="form-group">
                    <label class="form-label" for="fieldDescription">Описание</label>
                    <textarea class="form-input" id="fieldDescription" rows="3" maxlength="1000"
                              placeholder="Необязательное описание"></textarea>
                </div>
                <div class="form-group form-group-inline">
                    <input type="checkbox" id="fieldIsPublic">
                    <label class="form-label" for="fieldIsPublic">Публичная запись</label>
                </div>
                <div class="error-message" id="formError"></div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="cancelForm">Отмена</button>
                <button class="modal-btn modal-btn-primary" id="submitForm">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Ссылка для скачивания</h3>
                <button class="close-btn" id="closeShareModal">&times;</button>
            </div>
            <input type="text" class="share-link" id="shareLink" readonly>
            <button class="copy-btn" id="copyLinkBtn">Копировать ссылку</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
