<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись — каталог файлов</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B0C0F'/><path d='M10 7h7l6 6v12a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z' fill='none' stroke='%233DDC97' stroke-width='2' stroke-linejoin='round'/></svg>">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Запись о файле</h1>
            <p>Подробная информация и редактирование</p>
        </div>

        <div class="content-section">
            <div class="content-header">
                <div class="section-heading">
                    <button class="icon-btn" id="backBtn" title="К списку">
                        <img src="/static/icons/arrow-left-to-line.svg" class="icon-svg" alt="Назад">
                    </button>
                    <h2 class="record-title" id="recordTitle">Загрузка...</h2>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="refreshBtn" title="Обновить">
                        <img src="/static/icons/reload.svg" class="icon-svg" alt="Обновить">
                    </button>
                </div>
            </div>

            <div class="notice" id="message"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Загрузка записи...</p>
            </div>

            <div id="detailContent" style="display: none;">
                <div class="detail-grid">
                    <div class="detail-card">
                        <h3 class="detail-card-title">Редактируемые поля</h3>

                        <div class="form-group">
                            <label class="form-label" for="fieldFilename">Имя файла</label>
                            <input type="text" class="form-input" id="fieldFilename" maxlength="255">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="fieldDescription">Описание</label>
                            <textarea class="form-input" id="fieldDescription" rows="5"
                                      maxlength="1000" placeholder="Описание пока не задано"></textarea>
                        </div>

                        <div class="form-group form-group-inline">
                            <input type="checkbox" id="fieldIsPublic">
                            <label class="form-label" for="fieldIsPublic">Публичная запись</label>
                        </div>

                        <div class="error-message" id="formError"></div>

                        <div class="detail-actions">
                            <button class="modal-btn modal-btn-secondary" id="resetBtn">Сбросить</button>
                            <button class="modal-btn modal-btn-primary" id="saveBtn">Сохранить</button>
                        </div>
                    </div>

                    <div class="detail-card">
                        <h3 class="detail-card-title">Сведения</h3>
                        <dl class="detail-list">
                            <dt>Размер</dt><dd id="infoSize">—</dd>
                            <dt>Тип содержимого</dt><dd id="infoType">—</dd>
                            <dt>Файл загружен</dt><dd id="infoHasContent">—</dd>
                            <dt>Создана</dt><dd id="infoCreated">—</dd>
                            <dt>Изменена</dt><dd id="infoUpdated">—</dd>
                        </dl>

                        <div class="detail-buttons">
                            <button class="modal-btn modal-btn-secondary" id="uploadBtn">Загрузить</button>
                            <button class="modal-btn modal-btn-secondary" id="downloadBtn">Скачать</button>
                            <button class="modal-btn modal-btn-secondary" id="linkBtn">Скопировать ссылку</button>
                        </div>

                        <button class="modal-btn modal-btn-danger" id="deleteBtn">Удалить</button>
                    </div>
                </div>
            </div>

            <div class="empty-state" id="notFound" style="display: none;">
                <p>Запись не найдена. Возможно, она была удалена.</p>
                <button class="modal-btn modal-btn-primary" id="backToListBtn">К списку</button>
            </div>
        </div>
    </div>

    <input type="file" id="contentInput" class="file-input" hidden>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/detail.js"></script>
</body>
</html>
